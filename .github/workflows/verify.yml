name: Website verification
on: [push, pull_request]
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: rustup toolchain install 1.92.0 --profile minimal
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
      - run: npm run build
